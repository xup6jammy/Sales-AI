<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Customer Email Sales Advisor</title>
  <desc id="desc">An AI sales copilot that reads customer email like a senior account manager would — context first, draft last, never hits send.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- soft glow accent -->
  <circle cx="1080" cy="120" r="220" fill="#F59E0B" opacity="0.08"/>

  <!-- Eyebrow -->
  <g transform="translate(80, 70)">
    <rect width="14" height="14" rx="3" fill="url(#amber)"/>
    <text x="26" y="12" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="2.4" fill="#94A3B8">JAVA 21 · CLAUDE CODE SKILL · MCP-READY</text>
  </g>

  <!-- Title -->
  <text x="80" y="160" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="60" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Customer Email Sales Advisor</text>

  <!-- Tagline -->
  <text x="80" y="210" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">An AI sales copilot that reads your customer's email</text>
  <text x="80" y="240" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">like a senior account manager would.</text>

  <!-- Pills -->
  <g font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <g transform="translate(80, 280)">
      <rect width="178" height="32" rx="16" fill="url(#amber)"/>
      <text x="89" y="21" text-anchor="middle" fill="#0B1120">Context first</text>
    </g>
    <g transform="translate(268, 280)">
      <rect width="178" height="32" rx="16" fill="none" stroke="#475569" stroke-width="1.5"/>
      <text x="89" y="21" text-anchor="middle" fill="#E2E8F0">Never auto-send</text>
    </g>
    <g transform="translate(456, 280)">
      <rect width="178" height="32" rx="16" fill="none" stroke="#475569" stroke-width="1.5"/>
      <text x="89" y="21" text-anchor="middle" fill="#E2E8F0">Audit every action</text>
    </g>
    <g transform="translate(644, 280)">
      <rect width="200" height="32" rx="16" fill="none" stroke="#475569" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#E2E8F0">Zero dependencies</text>
    </g>
  </g>

  <!-- Right visual: layered envelope + shield -->
  <g transform="translate(880, 70)" filter="url(#glow)">
    <!-- back envelope -->
    <g transform="translate(40, 30) rotate(-6 130 80)">
      <rect width="260" height="160" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <path d="M 0 0 L 130 100 L 260 0" fill="none" stroke="#475569" stroke-width="1.5"/>
    </g>
    <!-- front envelope -->
    <g transform="translate(0, 60)">
      <rect width="280" height="180" rx="12" fill="#0F172A" stroke="url(#amber)" stroke-width="3"/>
      <path d="M 0 0 L 140 110 L 280 0" fill="none" stroke="url(#amber)" stroke-width="3"/>
      <!-- subject lines -->
      <rect x="22" y="138" width="160" height="6" rx="3" fill="#334155"/>
      <rect x="22" y="152" width="100" height="6" rx="3" fill="#334155"/>
    </g>
    <!-- shield with check -->
    <g transform="translate(220, 188)">
      <path d="M 0 -28 L 42 -16 L 42 28 Q 42 60 0 78 Q -42 60 -42 28 L -42 -16 Z" fill="#0B1120" stroke="#F8FAFC" stroke-width="2.5"/>
      <path d="M -16 6 L -4 18 L 18 -10" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
